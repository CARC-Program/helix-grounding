[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-grounding"
version = "0.1.2"
description = "Catch the numbers an AI made up, without asking another AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Deliberately a project name rather than a person, and deliberately without
# an email. This field is public the moment it uploads and is copied by
# mirrors within hours; an address here gets scraped for spam permanently.
#
# It is not a claim about who wrote this. Copyright sits with the author and
# is recorded in LICENSE, where it belongs. Which name goes in which field
# is a separate question from who wrote the code, and they are not the same.
authors = [{ name = "Helix Labs" }]
keywords = [
    "llm", "hallucination", "grounding", "validation", "evals",
    "guardrails", "verification", "ai-safety", "bom",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# No runtime dependencies, deliberately. The whole argument for this library is
# that checking a model's output should not require another model call -- a
# dependency on an inference client would undercut the claim. The BOM reviewer
# and its CLI are stdlib-only too, which is why they ship in the same wheel
# rather than costing anyone an install they did not ask for.
dependencies = []

[project.optional-dependencies]
# Only needed to have a model *write* the narrative. Everything the library
# verifies, and every deterministic check the CLI runs, works without these.
llm = ["ollama>=0.3", "anthropic>=0.40", "python-dotenv>=1.0"]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Documentation = "https://github.com/CARC-Program/helix-grounding#readme"
Source = "https://github.com/CARC-Program/helix-grounding"
Changelog = "https://github.com/CARC-Program/helix-grounding/blob/main/CHANGELOG.md"
"Decision log" = "https://github.com/CARC-Program/helix-grounding/blob/main/docs/DECISION_LOG.md"

[project.scripts]
helix-bom = "helix_bom.cli:main"
# Deliberately not published: see the wheel packages note below. Reachable
# from a source checkout as `python -m helix_ops.cli`.

[tool.hatch.build.targets.wheel]
# helix_api is deliberately absent: an undeployed skeleton is not something to
# put in someone else's site-packages. helix_ops is absent for the same
# reason and a stronger one -- it runs this business, not the user's, and
# nobody installing a verification library should receive a launch tracker.
packages = [
    "src/helix_grounding",
    "src/helix_bom",
    "src/helix_llm",
]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "scripts/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/sandbox"]
# tests/sandbox holds script-style suites that run as subprocesses via
# tests/test_sandbox_suite.py. Ignoring them here stops pytest importing them
# as modules as well, which would execute each one twice.
addopts = "--ignore=tests/sandbox"
