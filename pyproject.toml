[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-grounding"
version = "0.3.0"
description = "Catch the numbers an AI made up, without asking another AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Deliberately a project name rather than a person, and deliberately without
# an email. This field is public the moment it uploads and is copied by
# mirrors within hours; an address here gets scraped for spam permanently.
#
# It is not a claim about who wrote this. Copyright sits with the author and
# is recorded in LICENSE, where it belongs. Which name goes in which field
# is a separate question from who wrote the code, and they are not the same.
authors = [{ name = "Helix Labs" }]
keywords = [
    "llm", "hallucination", "grounding", "validation", "evals",
    "guardrails", "verification", "ai-safety", "bom",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# No runtime dependencies, deliberately. The whole argument for this library is
# that checking a model's output should not require another model call -- a
# dependency on an inference client would undercut the claim. The BOM reviewer
# and its CLI are stdlib-only too, which is why they ship in the same wheel
# rather than costing anyone an install they did not ask for.
dependencies = []

[project.optional-dependencies]
# Only needed to have a model *write* the narrative. Everything the library
# verifies, and every deterministic check the CLI runs, works without these.
llm = ["ollama>=0.3", "anthropic>=0.40", "python-dotenv>=1.0"]
# fastapi and httpx are here because the suite tests the API skeleton and
# three sandbox scripts drive it through TestClient, which needs httpx.
# They are test-only: helix_api ships in neither the wheel nor the sdist,
# and the runtime library still has no dependencies at all. Without them
# CI failed on all eight runners while release-check on the maintainer's
# machine reported all ten checks passing, which is the exact gap between
# a green local run and a red one that this file now closes.
dev = ["pytest>=8", "build", "twine", "fastapi", "httpx"]

[project.urls]
Documentation = "https://github.com/CARC-Program/helix-grounding#readme"
Source = "https://github.com/CARC-Program/helix-grounding"
Changelog = "https://github.com/CARC-Program/helix-grounding/blob/main/CHANGELOG.md"
"Decision log" = "https://github.com/CARC-Program/helix-grounding/blob/main/docs/DECISION_LOG.md"

[project.scripts]
helix-bom = "helix_bom.cli:main"

[project.gui-scripts]
# A windowed entry point rather than a console one: on Windows this
# builds an executable that can be double-clicked or dragged onto
# without a terminal appearing behind it, which is the whole point.
helix-bom-gui = "helix_bom.desktop:main"
# Deliberately not published: see the wheel packages note below. Reachable
# from a source checkout as `python ops.py` -- the launcher at the repo root,
# which works without an install or a PYTHONPATH. `python -m helix_ops.cli`
# only works if src/ is already on the path, and that caught out the first
# person who was not its author.

[tool.hatch.build.targets.wheel]
# helix_api is deliberately absent: an undeployed skeleton is not something to
# put in someone else's site-packages. helix_ops is absent for the same
# reason and a stronger one -- it runs this business, not the user's, and
# nobody installing a verification library should receive a launch tracker.
packages = [
    "src/helix_grounding",
    "src/helix_bom",
    "src/helix_llm",
]

[tool.hatch.build.targets.sdist]
# The wheel excludes the internal packages and, until 0.2.0, the sdist did not:
# it shipped `src/` whole, so helix_ops and helix_signal went to PyPI in every
# release. One of those files carried a real name as a regex literal, put there
# by the detector that was supposed to find such things and exempted from its
# own scan. `helix-ops release-check` now reads the built artifacts rather than
# the working tree, because the tree is not what gets published.
include = ["src/", "tests/", "docs/", "scripts/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
exclude = ["src/helix_ops/", "src/helix_api/", "src/helix_signal/", "src/helix_auto/", "tests/sandbox/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/sandbox"]
# tests/sandbox holds script-style suites that run as subprocesses via
# tests/test_sandbox_suite.py. Ignoring them here stops pytest importing them
# as modules as well, which would execute each one twice.
addopts = "--ignore=tests/sandbox"
